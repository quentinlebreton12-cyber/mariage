<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan de table — Notre Mariage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #FAF7F2;
  --warm: #F2EBE0;
  --gold: #C9A96E;
  --gold-light: #E8D5B0;
  --gold-dark: #8B6914;
  --green: #4A5E4A;
  --green-light: #E8EDE8;
  --ink: #2C2A25;
  --muted: #8A8070;
  --white: #FFFFFF;
  --danger: #C0392B;
  --danger-light: #FDECEA;
  --shadow: 0 2px 20px rgba(44,42,37,0.08);
  --shadow-lg: 0 8px 40px rgba(44,42,37,0.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Jost', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; }

/* ─── HEADER ─── */
header {
  background: var(--ink);
  color: var(--cream);
  padding: 18px 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
header h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 22px; letter-spacing: 0.04em; }
header h1 span { color: var(--gold); font-style: italic; }
.header-stats { display: flex; gap: 20px; font-size: 12px; font-weight: 300; color: var(--gold-light); letter-spacing: 0.06em; }
.header-stats strong { color: var(--gold); font-weight: 500; font-size: 15px; display: block; }

/* ─── LAYOUT ─── */
.layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 64px); }
@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: fixed; bottom: 0; left: 0; right: 0; max-height: 50vh; border-top: 1px solid var(--gold-light); border-radius: 16px 16px 0 0; z-index: 50; overflow-y: auto; }
  .canvas-area { padding-bottom: 52vh; }
  header h1 { font-size: 17px; }
  .header-stats { display: none; }
}

/* ─── SIDEBAR ─── */
.sidebar {
  background: var(--white);
  border-right: 1px solid var(--gold-light);
  display: flex; flex-direction: column;
}
.sb-block { padding: 18px 16px; border-bottom: 1px solid var(--warm); }
.sb-block h2 { font-family: 'Cormorant Garamond', serif; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 12px; }
.input-group { display: flex; gap: 6px; }
.input-group input { flex: 1; border: 1px solid var(--gold-light); background: var(--cream); border-radius: 6px; padding: 8px 12px; font-family: 'Jost', sans-serif; font-size: 13px; color: var(--ink); outline: none; transition: border-color 0.2s; }
.input-group input:focus { border-color: var(--gold); }
.btn { background: var(--ink); color: var(--cream); border: none; border-radius: 6px; padding: 8px 14px; font-family: 'Jost', sans-serif; font-size: 13px; cursor: pointer; transition: background 0.2s, transform 0.1s; white-space: nowrap; }
.btn:hover { background: var(--gold-dark); }
.btn:active { transform: scale(0.97); }
.btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--gold-light); }
.btn-outline:hover { background: var(--warm); }
.btn-danger { background: var(--danger); }
.btn-danger:hover { background: #a93226; }
.btn-sm { padding: 4px 10px; font-size: 11px; }
.btn-gold { background: var(--gold); color: var(--ink); }
.btn-gold:hover { background: var(--gold-dark); color: var(--cream); }

/* contraintes */
.constraint-row { display: flex; gap: 5px; }
.constraint-row select { flex: 1; border: 1px solid var(--gold-light); background: var(--cream); border-radius: 6px; padding: 7px 8px; font-size: 12px; font-family: 'Jost', sans-serif; color: var(--ink); }
.constraint-list { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; max-height: 110px; overflow-y: auto; }
.constraint-tag { display: flex; align-items: center; gap: 6px; background: #FFF5F5; border: 1px solid #F5C6C2; border-radius: 6px; padding: 4px 8px; font-size: 11px; }
.constraint-tag span { flex: 1; color: var(--danger); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.constraint-tag button { background: none; border: none; cursor: pointer; color: var(--danger); font-size: 14px; line-height: 1; padding: 0 2px; }

/* pool convives */
.guest-pool { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; min-height: 60px; }
.chip {
  background: var(--cream); border: 1px solid var(--gold-light);
  border-radius: 20px; padding: 4px 10px; font-size: 12px;
  cursor: grab; user-select: none; display: flex; align-items: center; gap: 5px;
  transition: all 0.15s; white-space: nowrap;
}
.chip:hover { border-color: var(--gold); background: var(--warm); }
.chip.placed { opacity: 0.35; cursor: default; }
.chip .chip-del { cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; padding: 0 1px; }
.chip .chip-del:hover { color: var(--danger); }
.chip.dragging { opacity: 0.5; }

/* ─── CANVAS ─── */
.canvas-area { padding: 24px; overflow: auto; }
.canvas-area h2 { font-family: 'Cormorant Garamond', serif; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
.tables-grid { display: flex; flex-wrap: wrap; gap: 16px; }

/* ─── TABLE CARD ─── */
.table-card {
  background: var(--white);
  border: 1.5px solid var(--gold-light);
  border-radius: 14px;
  padding: 14px;
  width: 220px;
  flex-shrink: 0;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: var(--shadow);
}
.table-card.dragover { border-color: var(--green); background: var(--green-light); box-shadow: var(--shadow-lg); }
.table-card.full { border-color: var(--gold); }
.table-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.table-icon { width: 32px; height: 32px; border: 1.5px solid var(--gold-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); flex-shrink: 0; }
.table-icon.rect { border-radius: 6px; }
.table-name { flex: 1; font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; color: var(--ink); cursor: text; }
.table-name[contenteditable]:focus { outline: none; border-bottom: 1px solid var(--gold); }
.table-meta { font-size: 11px; color: var(--muted); }
.progress-bar { height: 3px; background: var(--warm); border-radius: 2px; margin-bottom: 10px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.3s; }
.progress-fill.full { background: var(--green); }
.table-seats { display: flex; flex-wrap: wrap; gap: 4px; min-height: 28px; }
.seat-chip {
  background: var(--cream); border: 1px solid var(--gold-light);
  border-radius: 14px; padding: 3px 9px; font-size: 11px;
  cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.15s;
}
.seat-chip:hover { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
.seat-chip.conflict { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
.seat-chip .seat-x { font-size: 13px; opacity: 0; transition: opacity 0.15s; }
.seat-chip:hover .seat-x { opacity: 1; }
.empty-slot {
  border: 1px dashed var(--gold-light); border-radius: 14px;
  padding: 3px 9px; font-size: 11px; color: var(--muted);
  font-style: italic;
}
.table-actions { display: flex; justify-content: flex-end; margin-top: 10px; }

/* ─── TOOLBAR ─── */
.toolbar {
  background: var(--white); border-bottom: 1px solid var(--warm);
  padding: 10px 24px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  position: sticky; top: 64px; z-index: 40;
}
.toolbar-label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-right: 4px; }
.sep { width: 1px; background: var(--warm); height: 24px; margin: 0 4px; }

/* ─── MODAL ─── */
.overlay { position: fixed; inset: 0; background: rgba(44,42,37,0.5); z-index: 200; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
.overlay.open { display: flex; }
.modal { background: var(--white); border-radius: 16px; padding: 28px; max-width: 480px; width: 90%; box-shadow: var(--shadow-lg); }
.modal h3 { font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 16px; }
.modal pre { background: var(--cream); border: 1px solid var(--warm); border-radius: 8px; padding: 14px; font-size: 12px; white-space: pre-wrap; max-height: 50vh; overflow-y: auto; font-family: monospace; color: var(--ink); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ─── BADGE ─── */
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 500; letter-spacing: 0.05em; }
.badge-conflict { background: var(--danger-light); color: var(--danger); }
.badge-ok { background: var(--green-light); color: var(--green); }

/* ─── EMPTY STATE ─── */
.empty-state { color: var(--muted); font-size: 13px; font-style: italic; padding: 8px 0; }

/* ─── CONFLICT BANNER ─── */
.conflict-banner { background: var(--danger-light); border: 1px solid #F5C6C2; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--danger); margin-bottom: 12px; display: none; }

/* PRINT */
@media print {
  header, .toolbar, .sidebar, .conflict-banner { display: none !important; }
  .layout { display: block; }
  .canvas-area { padding: 0; }
  .table-card { page-break-inside: avoid; border: 1px solid #ccc; box-shadow: none; }
  .tables-grid { gap: 12px; }
}
</style>
</head>
<body>

<header>
  <h1>Plan de table — <span>Notre Mariage</span></h1>
  <div class="header-stats">
    <div><strong id="hPlaced">0</strong>placés</div>
    <div><strong id="hTotal">0</strong>convives</div>
    <div><strong id="hConflicts">0</strong>conflits</div>
    <div><strong id="hFree">0</strong>places libres</div>
  </div>
</header>

<div class="toolbar">
  <span class="toolbar-label">Ajouter table</span>
  <button class="btn btn-outline btn-sm" onclick="addTable('oval',10)">⬭ Ovale 10</button>
  <button class="btn btn-outline btn-sm" onclick="addTable('rect',14)">▭ Rect. 14</button>
  <button class="btn btn-outline btn-sm" onclick="addTable('oval',8)">⬭ Ovale 8</button>
  <button class="btn btn-outline btn-sm" onclick="addTable('rect',6)">▭ Rect. 6</button>
  <div class="sep"></div>
  <button class="btn btn-gold btn-sm" onclick="autoPlace()">✦ Placement auto</button>
  <button class="btn btn-outline btn-sm" onclick="showExport()">↓ Résumé</button>
  <button class="btn btn-outline btn-sm" onclick="window.print()">⎙ Imprimer</button>
  <button class="btn btn-danger btn-sm" onclick="resetAll()" style="margin-left:auto;">⟳ Réinitialiser</button>
</div>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-block">
      <h2>Ajouter un convive</h2>
      <div class="input-group">
        <input type="text" id="guestInput" placeholder="Prénom Nom" onkeydown="if(event.key==='Enter')addGuest()">
        <button class="btn" onclick="addGuest()">+</button>
      </div>
    </div>

    <div class="sb-block">
      <h2>Contraintes</h2>
      <div class="constraint-row">
        <select id="c1"><option value="">A…</option></select>
        <select id="c2"><option value="">ne pas avec…</option></select>
      </div>
      <div style="margin-top:6px;">
        <button class="btn btn-outline btn-sm" style="width:100%" onclick="addConstraint()">Ajouter contrainte ✗</button>
      </div>
      <div class="constraint-list" id="constraintList"></div>
    </div>

    <div class="sb-block" style="padding-bottom:8px;">
      <h2>Non placés (<span id="unplacedCount">0</span>)</h2>
      <div id="conflictBanner" class="conflict-banner"></div>
    </div>
    <div class="guest-pool" id="guestPool"></div>
  </aside>

  <!-- CANVAS -->
  <main class="canvas-area">
    <h2>Salle de réception</h2>
    <div class="tables-grid" id="tablesGrid"></div>
    <div id="emptyCanvas" style="padding:40px;text-align:center;color:var(--muted);font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;display:none;">
      Ajoutez des tables pour commencer le plan de table
    </div>
  </main>
</div>

<!-- MODAL EXPORT -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>Résumé du plan de table</h3>
    <pre id="exportText"></pre>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="copyExport()">Copier</button>
      <button class="btn" onclick="closeModal()">Fermer</button>
    </div>
  </div>
</div>

<script>
// ─── STATE ───
let state = { guests: [], tables: [], constraints: [], tableCount: 0 };

function save() {
  localStorage.setItem('mariage_plan', JSON.stringify(state));
}
function load() {
  const raw = localStorage.getItem('mariage_plan');
  if (raw) { try { state = JSON.parse(raw); } catch(e) {} }
}

// ─── INIT ───
load();
if (state.tables.length === 0) {
  // Tables par défaut selon les specs : 2 rectangulaires 14 + 11 ovales 10
  for (let i = 0; i < 11; i++) addTableSilent('oval', 10);
  for (let i = 0; i < 2; i++) addTableSilent('rect', 14);
}
renderAll();

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

// ─── TABLES ───
function addTableSilent(shape, capacity) {
  state.tableCount++;
  const label = shape === 'rect' ? `Table rect. ${state.tableCount}` : `Table ${state.tableCount}`;
  state.tables.push({ id: uid(), name: label, shape, capacity, seats: [] });
}
function addTable(shape, capacity) {
  addTableSilent(shape, capacity);
  save();
  renderAll();
}
function deleteTable(id) {
  const t = state.tables.find(x => x.id === id);
  if (!t) return;
  if (!confirm(`Supprimer "${t.name}" ? Les convives placés retourneront dans le pool.`)) return;
  t.seats.forEach(sid => {
    const g = state.guests.find(x => x.id === sid);
    if (g) g.tableId = null;
  });
  state.tables = state.tables.filter(x => x.id !== id);
  save(); renderAll();
}

// ─── GUESTS ───
function addGuest() {
  const inp = document.getElementById('guestInput');
  const name = inp.value.trim();
  if (!name) return;
  state.guests.push({ id: uid(), name, tableId: null });
  inp.value = '';
  save(); renderAll();
}
function removeGuest(id) {
  const g = state.guests.find(x => x.id === id);
  if (g && g.tableId) {
    const t = state.tables.find(x => x.id === g.tableId);
    if (t) t.seats = t.seats.filter(s => s !== id);
  }
  state.guests = state.guests.filter(x => x.id !== id);
  state.constraints = state.constraints.filter(c => c.a !== id && c.b !== id);
  save(); renderAll();
}
function removeSeat(gid, tid) {
  const t = state.tables.find(x => x.id === tid);
  const g = state.guests.find(x => x.id === gid);
  if (t) t.seats = t.seats.filter(s => s !== gid);
  if (g) g.tableId = null;
  save(); renderAll();
}

// ─── CONSTRAINTS ───
function addConstraint() {
  const a = document.getElementById('c1').value;
  const b = document.getElementById('c2').value;
  if (!a || !b || a === b) return;
  if (state.constraints.find(c => (c.a===a&&c.b===b)||(c.a===b&&c.b===a))) return;
  state.constraints.push({ a, b });
  save(); renderAll();
}
function removeConstraint(idx) {
  state.constraints.splice(idx, 1);
  save(); renderAll();
}
function hasConflict(gid, tid) {
  const t = state.tables.find(x => x.id === tid);
  if (!t) return false;
  return t.seats.some(sid => sid !== gid && state.constraints.find(c =>
    (c.a===gid&&c.b===sid)||(c.a===sid&&c.b===gid)
  ));
}
function conflictsWith(ga, gb) {
  return !!state.constraints.find(c => (c.a===ga&&c.b===gb)||(c.a===gb&&c.b===ga));
}
function countConflicts() {
  let n = 0;
  for (const t of state.tables) {
    for (let i = 0; i < t.seats.length; i++)
      for (let j = i+1; j < t.seats.length; j++)
        if (conflictsWith(t.seats[i], t.seats[j])) n++;
  }
  return n;
}
function gname(id) { const g = state.guests.find(x => x.id === id); return g ? g.name : '?'; }

// ─── AUTO PLACE ───
function autoPlace() {
  const unplaced = state.guests.filter(g => !g.tableId);
  if (!unplaced.length) { alert('Tous les convives sont déjà placés !'); return; }
  let placed = 0;
  for (const g of unplaced) {
    let best = null;
    for (const t of state.tables) {
      if (t.seats.length >= t.capacity) continue;
      if (!t.seats.some(sid => conflictsWith(g.id, sid))) {
        best = t; break;
      }
    }
    if (!best) {
      for (const t of state.tables) {
        if (t.seats.length < t.capacity) { best = t; break; }
      }
    }
    if (best) {
      g.tableId = best.id;
      best.seats.push(g.id);
      placed++;
    }
  }
  save(); renderAll();
  if (placed < unplaced.length) alert(`${unplaced.length - placed} convive(s) n'ont pas pu être placés (plus de places disponibles).`);
}

// ─── DRAG & DROP ───
let draggedId = null;

// ─── RENDER ───
function renderAll() {
  renderPool();
  renderTables();
  renderConstraints();
  updateSelects();
  updateHeader();
}

function renderPool() {
  const pool = document.getElementById('guestPool');
  document.getElementById('unplacedCount').textContent = state.guests.filter(g => !g.tableId).length;

  // conflict banner
  const conflicts = countConflicts();
  const banner = document.getElementById('conflictBanner');
  if (conflicts > 0) {
    banner.style.display = 'block';
    banner.textContent = `⚠ ${conflicts} conflit(s) de contrainte détecté(s). Les noms en rouge indiquent des voisins incompatibles.`;
  } else {
    banner.style.display = 'none';
  }

  pool.innerHTML = state.guests.map(g => `
    <div class="chip ${g.tableId ? 'placed' : ''}"
         draggable="${!g.tableId}"
         data-id="${g.id}"
         ondragstart="draggedId='${g.id}';this.classList.add('dragging')"
         ondragend="this.classList.remove('dragging')">
      ${g.name}
      <span class="chip-del" onclick="event.stopPropagation();removeGuest('${g.id}')">×</span>
    </div>`).join('');
}

function renderTables() {
  const grid = document.getElementById('tablesGrid');
  const empty = document.getElementById('emptyCanvas');
  if (state.tables.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = state.tables.map(t => {
    const pct = Math.round(t.seats.length / t.capacity * 100);
    const isFull = t.seats.length >= t.capacity;
    const isOval = t.shape === 'oval';

    const seatsHtml = t.seats.map(sid => {
      const g = state.guests.find(x => x.id === sid);
      if (!g) return '';
      const conflict = hasConflict(sid, t.id);
      return `<div class="seat-chip ${conflict ? 'conflict' : ''}" title="${g.name}${conflict ? ' ⚠ conflit !' : ''} — cliquer pour retirer" onclick="removeSeat('${sid}','${t.id}')">
        ${g.name.split(' ')[0]}
        <span class="seat-x">×</span>
      </div>`;
    }).join('');

    const emptySlots = Math.max(0, Math.min(t.capacity - t.seats.length, 4));
    const emptySlotsHtml = !isFull ? `<div class="empty-slot">+${t.capacity - t.seats.length} libre${t.capacity - t.seats.length > 1 ? 's' : ''}</div>` : '';

    return `<div class="table-card ${isFull ? 'full' : ''}"
      data-id="${t.id}"
      ondragover="event.preventDefault();this.classList.add('dragover')"
      ondragleave="this.classList.remove('dragover')"
      ondrop="event.preventDefault();this.classList.remove('dragover');dropOnTable('${t.id}')">
      <div class="table-card-header">
        <div class="table-icon ${isOval ? '' : 'rect'}">${isOval ? '⬭' : '▭'}</div>
        <div>
          <div class="table-name" contenteditable="true"
            onblur="renameTable('${t.id}',this.textContent.trim())"
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${t.name}</div>
          <div class="table-meta">${t.seats.length}/${t.capacity} places</div>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill ${isFull ? 'full' : ''}" style="width:${pct}%"></div></div>
      <div class="table-seats">${seatsHtml}${emptySlotsHtml}</div>
      <div class="table-actions">
        <button class="btn btn-outline btn-sm" onclick="deleteTable('${t.id}')">Supprimer</button>
      </div>
    </div>`;
  }).join('');
}

function renameTable(id, name) {
  const t = state.tables.find(x => x.id === id);
  if (t && name) { t.name = name; save(); }
}

function dropOnTable(tid) {
  if (!draggedId) return;
  const g = state.guests.find(x => x.id === draggedId);
  const t = state.tables.find(x => x.id === tid);
  draggedId = null;
  if (!g || !t || g.tableId === tid) return;
  if (t.seats.length >= t.capacity) { alert(`La table "${t.name}" est complète !`); return; }
  if (g.tableId) {
    const old = state.tables.find(x => x.id === g.tableId);
    if (old) old.seats = old.seats.filter(s => s !== g.id);
  }
  g.tableId = tid;
  t.seats.push(g.id);
  save(); renderAll();
}

function renderConstraints() {
  const el = document.getElementById('constraintList');
  el.innerHTML = state.constraints.map((c, i) => `
    <div class="constraint-tag">
      <span>${gname(c.a)} ✗ ${gname(c.b)}</span>
      <button onclick="removeConstraint(${i})" title="Supprimer">×</button>
    </div>`).join('');
}

function updateSelects() {
  const opts = state.guests.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
  document.getElementById('c1').innerHTML = '<option value="">A…</option>' + opts;
  document.getElementById('c2').innerHTML = '<option value="">ne pas avec…</option>' + opts;
}

function updateHeader() {
  const placed = state.guests.filter(g => g.tableId).length;
  const total = state.guests.length;
  const conflicts = countConflicts();
  const totalSeats = state.tables.reduce((s, t) => s + t.capacity, 0);
  const free = totalSeats - placed;
  document.getElementById('hPlaced').textContent = placed;
  document.getElementById('hTotal').textContent = total;
  document.getElementById('hConflicts').textContent = conflicts;
  document.getElementById('hFree').textContent = free;
}

// ─── EXPORT ───
function showExport() {
  let text = 'PLAN DE TABLE — RÉSUMÉ\n';
  text += '═'.repeat(40) + '\n\n';
  for (const t of state.tables) {
    text += `${t.name.toUpperCase()} (${t.shape === 'oval' ? 'ovale' : 'rect.'}, ${t.capacity} places)\n`;
    text += '─'.repeat(35) + '\n';
    if (t.seats.length === 0) {
      text += '  (aucun convive)\n';
    } else {
      t.seats.forEach((sid, i) => {
        const g = state.guests.find(x => x.id === sid);
        const conflict = hasConflict(sid, t.id);
        text += `  ${i+1}. ${g ? g.name : '?'}${conflict ? ' ⚠' : ''}\n`;
      });
    }
    text += `  Places libres : ${t.capacity - t.seats.length}\n\n`;
  }
  const unplaced = state.guests.filter(g => !g.tableId);
  if (unplaced.length) {
    text += 'NON PLACÉS\n' + '─'.repeat(35) + '\n';
    unplaced.forEach(g => { text += `  • ${g.name}\n`; });
  }
  text += '\n' + '═'.repeat(40) + '\n';
  text += `Total : ${state.guests.filter(g=>g.tableId).length}/${state.guests.length} convives placés`;
  document.getElementById('exportText').textContent = text;
  document.getElementById('overlay').classList.add('open');
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
function copyExport() {
  navigator.clipboard.writeText(document.getElementById('exportText').textContent)
    .then(() => alert('Copié dans le presse-papiers !'));
}

function resetAll() {
  if (!confirm('Réinitialiser tout le plan de table ? Cette action est irréversible.')) return;
  state = { guests: [], tables: [], constraints: [], tableCount: 0 };
  for (let i = 0; i < 11; i++) addTableSilent('oval', 10);
  for (let i = 0; i < 2; i++) addTableSilent('rect', 14);
  save(); renderAll();
}

// Touch support for mobile
let touchGuest = null;
document.addEventListener('touchstart', e => {
  const chip = e.target.closest('.chip:not(.placed)');
  if (chip) { touchGuest = chip.dataset.id; chip.style.opacity = '0.5'; }
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!touchGuest) return;
  const card = document.elementFromPoint(e.changedTouches[0].clientX, e.changedTouches[0].clientY)?.closest('.table-card');
  if (card) dropOnTable(card.dataset.id);
  document.querySelectorAll('.chip').forEach(c => c.style.opacity = '');
  touchGuest = null;
}, { passive: true });
</script>
